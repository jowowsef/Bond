plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.bond.prefs'
version = '1.0.0'

android {
  namespace "com.bond.prefs"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Provided by the app (React Native uses AppCompat); only needed to compile.
  compileOnly "androidx.appcompat:appcompat:1.7.0"
}
