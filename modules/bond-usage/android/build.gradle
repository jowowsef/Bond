plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.bond.usage'
version = '1.0.0'

android {
  namespace "com.bond.usage"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles "proguard-rules.pro"
  }
  lintOptions {
    abortOnError false
  }
  // Live build (-PbondLive=true): the manifest that also declares the
  // optional accessibility service. The standard build has none of it.
  sourceSets {
    main {
      if ((findProperty('bondLive') ?: 'false').toString() == 'true') {
        manifest.srcFile 'src/live/AndroidManifest.xml'
      }
    }
  }
}

dependencies {
  // Unit tests only (src/test); not part of the app.
  testImplementation 'junit:junit:4.13.2'
}
